<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#020617">
<title>CRM Doña Miriam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: misma estructura y estilo del WaCRM de Remesas Ya (oscuro + morado, menú lateral, encabezado de 56px, tablero y bandeja), con solo las opciones de Doña Miriam y letra un poco más grande. */
:root {
  --background: oklch(0.13 0.01 260); --foreground: oklch(0.985 0 0); --card: oklch(0.18 0.01 260); --card-2: oklch(0.16 0.01 260);
  --muted: oklch(0.22 0.01 260); --muted-foreground: oklch(0.68 0.01 260); --border: oklch(0.28 0.01 260); --sidebar: oklch(0.18 0.01 260);
  --primary: oklch(0.585 0.22 293); --primary-fg: oklch(0.985 0 0); --primary-soft: oklch(0.585 0.22 293 / 0.16); --primary-text: oklch(0.72 0.17 293);
  --overlay: oklch(0.13 0.01 260 / 0.7);
  --st-nuevo: #f59e0b; --st-pago: #22c55e; --st-entregado: #94a3b8; --st-cancelado: #ef4444;
  --wa: oklch(0.585 0.22 293); --bubble-me: oklch(0.585 0.22 293); --bubble-me-fg: oklch(0.985 0 0); --bubble-them: oklch(0.22 0.01 260);
  --radius: 0.625rem;
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --background: oklch(0.99 0.002 260); --foreground: oklch(0.21 0.01 260); --card: oklch(1 0 0); --card-2: oklch(0.975 0.003 260);
    --muted: oklch(0.967 0.003 260); --muted-foreground: oklch(0.52 0.015 260); --border: oklch(0.922 0.004 260); --sidebar: oklch(1 0 0);
    --primary: oklch(0.526 0.247 293); --primary-soft: oklch(0.526 0.247 293 / 0.1); --primary-text: oklch(0.526 0.247 293); --overlay: oklch(0.2 0.01 260 / 0.45);
    --st-pago: #16a34a; --st-entregado: #64748b; --wa: oklch(0.526 0.247 293); --bubble-me: oklch(0.526 0.247 293); --bubble-them: oklch(0.967 0.003 260);
    --shadow: 0 1px 2px oklch(0.2 0.01 260 / 0.06), 0 2px 8px oklch(0.2 0.01 260 / 0.05); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --background: oklch(0.99 0.002 260); --foreground: oklch(0.21 0.01 260); --card: oklch(1 0 0); --card-2: oklch(0.975 0.003 260);
  --muted: oklch(0.967 0.003 260); --muted-foreground: oklch(0.52 0.015 260); --border: oklch(0.922 0.004 260); --sidebar: oklch(1 0 0);
  --primary: oklch(0.526 0.247 293); --primary-soft: oklch(0.526 0.247 293 / 0.1); --primary-text: oklch(0.526 0.247 293); --overlay: oklch(0.2 0.01 260 / 0.45);
  --st-pago: #16a34a; --st-entregado: #64748b; --wa: oklch(0.526 0.247 293); --bubble-me: oklch(0.526 0.247 293); --bubble-them: oklch(0.967 0.003 260);
  --shadow: 0 1px 2px oklch(0.2 0.01 260 / 0.06), 0 2px 8px oklch(0.2 0.01 260 / 0.05); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 16px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

.shell { display: flex; min-height: 100%; }
/* Barra lateral (igual que WaCRM: logo, menú, usuario abajo) */
.sidebar { width: 248px; flex: 0 0 248px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 0 12px 12px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; height: 56px; margin: 0 -12px 12px; padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px; }
.brand .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-weight: 800; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted-foreground); }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 12px; border: 0; background: transparent; border-radius: var(--radius); text-align: left; font-size: 16px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; }
.nav button:hover { background: var(--muted); color: var(--foreground); }
.nav button.on { background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.nav .count { margin-left: auto; background: var(--primary); color: var(--primary-fg); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 1px 8px; }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--muted); color: var(--foreground); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: 0 0 auto; }
.scrim { display: none; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--background); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; min-height: 56px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--background); }
.header h1 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
.header .sub { font-size: 13px; color: var(--muted-foreground); }
.icon-btn { width: 44px; height: 44px; border-radius: var(--radius); border: 0; background: transparent; color: var(--muted-foreground); display: grid; place-items: center; cursor: pointer; }
.menu-btn { display: none; }
.content { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; min-width: 0; }
.content > *, .list > * { min-width: 0; }
.chat-item { overflow: hidden; }
.demo-note { font-size: 13px; color: var(--muted-foreground); background: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); padding: 8px 12px; }

/* Filtro de días */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip span { color: var(--muted-foreground); font-weight: 500; margin-left: 6px; }
.chip.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.chip.on span { color: var(--background); opacity: .75; }
.cupo { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.cupo .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--muted); overflow: hidden; min-width: 80px; }
.cupo .bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.cupo b { font-variant-numeric: tabular-nums; }

/* Tablero (mismo patrón que pipeline-board.tsx) */
.board { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.col { flex: 0 0 auto; width: min(85vw, 340px); scroll-snap-align: start; background: var(--card-2); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.col .top { height: 3px; margin: 0 -14px; border-radius: 14px 14px 0 0; }
.col header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; }
.col h3 { margin: 0; font-size: 16px; font-weight: 700; }
.col .n { background: var(--muted); color: var(--muted-foreground); border-radius: 999px; font-size: 13px; font-weight: 600; padding: 2px 10px; }
.col .hint { margin: -4px 0 0; font-size: 13px; color: var(--muted-foreground); }
.empty { border: 2px dashed var(--border); border-radius: var(--radius); padding: 28px 12px; text-align: center; color: var(--muted-foreground); font-size: 14px; }

/* Tarjeta (mismo patrón que deal-card.tsx, con letra más grande) */
.deal { position: relative; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 14px 14px 14px 18px; box-shadow: var(--shadow); cursor: pointer; display: grid; gap: 8px; transition: transform .15s, box-shadow .15s; }
.deal:hover { transform: translateY(-1px); }
.deal .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 14px 0 0 14px; }
.deal h4 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
.deal .who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted-foreground); min-width: 0; }
.deal .who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deal .ini { width: 24px; height: 24px; border-radius: 999px; background: var(--muted); color: var(--foreground); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: 0 0 auto; }
.deal .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.deal .val { font-weight: 800; color: var(--primary-text); font-size: 17px; font-variant-numeric: tabular-nums; }
.deal .date { display: flex; align-items: center; gap: 5px; font-size: 14px; color: var(--muted-foreground); }
.deal .date svg { width: 16px; height: 16px; }
.deal .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--muted); color: var(--muted-foreground); }
.tag.vip { background: var(--primary-soft); color: var(--primary-text); }
.move { display: flex; gap: 8px; }
.move button { flex: 1; min-height: 48px; border-radius: var(--radius); border: 0; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #fff; }

/* Ficha del encargo (como el formulario del deal, en panel) */
.drawer-scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 20; }
.drawer { position: fixed; z-index: 21; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -8px 0 30px oklch(0 0 0 / .15); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer .dh { display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
.drawer .dh h2 { margin: 0; font-size: 20px; line-height: 1.25; flex: 1; min-width: 0; }
.drawer .db { overflow-y: auto; padding: 16px; display: grid; gap: 18px; align-content: start; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 8px; }
.stages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stages button { min-height: 52px; border-radius: var(--radius); border: 2px solid var(--border); background: var(--card); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.stages button i { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
.stages button.on { border-color: currentColor; }
.box { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 12px 14px; background: var(--card-2); }
.box ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; }
.kv dt { color: var(--muted-foreground); }
.kv dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.btn { min-height: 52px; border-radius: var(--radius); border: 0; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; width: 100%; text-decoration: none; }
.btn.wa { background: var(--wa); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--foreground); }
.hist { display: grid; gap: 8px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.hist div:last-child { border-bottom: 0; }
.note-in { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--foreground); padding: 10px 12px; font: inherit; resize: vertical; }
.confirm { background: var(--muted); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; font-size: 15px; }
.confirm .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Clientes y cocina */
.list { display: grid; gap: 10px; }
.client { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 12px 14px; }
.client .t { flex: 1; min-width: 0; }
.client b { display: block; font-size: 16px; }
.client small { color: var(--muted-foreground); font-size: 14px; }
.cook { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 4px 16px 8px; }
.cook h4 { margin: 14px 0 4px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.cook .r { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 17px; }
.cook .r:last-child { border-bottom: 0; }
.cook .r b { font-size: 22px; color: var(--primary-text); font-variant-numeric: tabular-nums; }

/* Bandeja de mensajes (como el inbox de WaCRM) */
.chat-item { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); padding: 12px 14px; cursor: pointer; }
.chat-item .t { flex: 1; min-width: 0; }
.chat-item b { display: block; font-size: 16px; }
.chat-item small { display: block; color: var(--muted-foreground); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item .side { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted-foreground); }
.unread { background: var(--primary); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; }
.chat-deal { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; background: var(--card); }
.chat-deal .move { flex-basis: 100%; }
.chat-deal .chip { padding: 6px 12px; font-size: 14px; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--background); }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; font-size: 16px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.msg.c { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 6px; }
.msg.m { align-self: flex-end; background: var(--bubble-me); color: var(--bubble-me-fg); border-bottom-right-radius: 6px; }
.msg.m time { color: oklch(0.985 0 0 / 0.7); }
.msg time { display: block; font-size: 11px; color: var(--muted-foreground); text-align: right; margin-top: 2px; }
.foto { width: 190px; max-width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; background: repeating-linear-gradient(135deg, var(--muted) 0 10px, var(--card-2) 10px 20px); border: 1px solid var(--border); display: grid; place-items: center; text-align: center; color: var(--muted-foreground); font-size: 14px; padding: 10px; }
.quick { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 0; background: var(--card); scrollbar-width: none; }
.quick .chip { font-size: 14px; padding: 7px 12px; }
.composer { display: flex; gap: 8px; padding: 10px 12px 12px; background: var(--card); }
.composer input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--border); border-radius: 999px; padding: 0 16px; font: inherit; background: var(--background); color: var(--foreground); }
.composer button { width: 48px; height: 48px; border-radius: 999px; border: 0; background: var(--wa); color: #fff; display: grid; place-items: center; cursor: pointer; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--foreground); color: var(--background); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 900px) {
  .sidebar { position: fixed; z-index: 15; left: 0; top: 0; bottom: 0; height: 100%; transform: translateX(-105%); transition: transform .2s; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .sidebar.open { transform: none; box-shadow: 8px 0 30px oklch(0 0 0 / .2); }
  .scrim.open { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 14; }
  .menu-btn { display: grid; }
}
@media (min-width: 1200px) { .col { width: auto; flex: 1 1 260px; } .board { margin-inline: 0; padding-inline: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head><body>

<div class="shell">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menú">
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.6z"/></svg></div><div>Doña Miriam<small>Encargos</small></div><button class="icon-btn menu-btn" id="closeMenu" aria-label="Cerrar menú" style="margin-left:auto"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ul class="nav" id="nav">
      <li><button data-v="tablero" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="11" rx="1.5"/></svg>Encargos<span class="count" id="navNuevos">0</span></button></li>
      <li><button data-v="mensajes"><svg class="i" viewBox="0 0 24 24"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1 1 20.5 11.6z"/></svg>Bandeja de entrada<span class="count" id="navMsgs">0</span></button></li>
      <li><button data-v="cocinar"><svg class="i" viewBox="0 0 24 24"><path d="M4 11h16"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 4v3"/><path d="M8 5l1 2M16 5l-1 2"/></svg>Qué cocinar</button></li>
      <li><button data-v="clientes"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Contactos</button></li>
    </ul>
    <div class="side-foot"><div class="avatar">M</div><div>Miriam<br><small style="color:var(--muted-foreground)">Dueña</small></div></div>
  </aside>

  <main class="main">
    <div class="header">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div style="flex:1;min-width:0"><h1 id="title">Encargos</h1><div class="sub" id="subtitle"></div></div>
      <button class="icon-btn" id="modeBtn" aria-label="Cambiar a modo claro u oscuro"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <span class="avatar" style="width:32px;height:32px">M</span>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="drawerRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
// Igual que WaCRM: arranca en modo oscuro salvo que se elija otro
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = "dark";
const STAGES = [

function chips() {
  const dias = [...new Set([H, M, P, ...deals.filter((d) => d.fecha >= H).map((d) => d.fecha)])].sort();
  const c = (f) => deals.filter((d) => d.fecha === f && d.stage !== "cancelado").reduce((a, d) => a + d.charolas, 0);
  return `<div class="chips" role="tablist">${dias.map((f) => { const x = fmt(f); const t = f === H ? "Hoy" : f === M ? "Mañana" : `${x.dia.slice(0, 3)} ${x.n}`; return `<button class="chip ${f === filtro ? "on" : ""}" data-f="${f}">${t}<span>${c(f)}</span></button>`; }).join("")}</div>`;
}
function cupo() {
  const n = deals.filter((d) => d.fecha === filtro && d.stage !== "cancelado").reduce((a, d) => a + d.charolas, 0);
  const x = fmt(filtro);
  return `<div class="cupo"><span>Cupo del ${x.dia} ${x.n}:</span><div class="bar"><i style="width:${Math.min(100, n * 10)}%"></i></div><b>${n} de 10</b></div>`;
}

  const tags = [];
  if ((historial[d.nombre] || []).length) tags.push(`<span class="tag vip">Cliente frecuente</span>`);
  if (d.notas) tags.push(`<span class="tag">📝 Con nota</span>`);
  return `<div class="deal" data-open="${d.id}" role="button" tabindex="0">
    <span class="bar" style="background:${s.c}"></span>

}

function cocinar() {
  const lista = deals.filter((d) => d.fecha === filtro && d.stage !== "cancelado");
  const cuenta = {}, extras = {};
  lista.forEach((d) => { d.charolasDet.forEach((c) => c.split(",").map((x) => x.trim()).forEach((x) => (cuenta[x] = (cuenta[x] || 0) + 1))); d.extras.forEach((e) => (extras[e] = (extras[e] || 0) + 1)); });
  const total = lista.reduce((a, d) => a + d.charolas, 0); const x = fmt(filtro);
  let h = "";
  GRUPOS.forEach(([t, ops]) => { const f = ops.filter((o) => cuenta[o]); if (f.length) h += `<h4>${t}</h4>` + f.map((o) => `<div class="r"><span>${o}</span><b>${cuenta[o]}</b></div>`).join(""); });
  if (Object.keys(extras).length) h += `<h4>Extras</h4>` + Object.entries(extras).map(([k, v]) => `<div class="r"><span>${k}</span><b>${v}</b></div>`).join("");
  return `${chips()}<div class="cupo"><span><b>${plural(total, "charola")}</b> para el ${x.dia} ${x.n}</span></div>${total ? `<div class="cook">${h}</div>` : `<div class="empty">No hay nada que cocinar ese día</div>`}`;
}

  const arr = Object.values(map).sort((a, b) => b.n - a.n);
  return `<div class="demo-note">Clientes de ejemplo.</div><div class="list">${arr.map((c) => { const x = fmt(c.ultimo); return `<div class="client"><span class="avatar">${ini(c.nombre)}</span><div class="t"><b>${esc(c.nombre)}</b><small>${plural(Math.round(c.n), "pedido")} · último: ${x.dia} ${x.n} ${x.mes}${c.tel ? " · " + esc(c.tel) : ""}</small></div></div>`; }).join("")}</div>`;
}

document.addEventListener("click", (e) => {

  const nav = t.closest("#nav button"); if (nav) { vista = nav.dataset.v; abierto = null; $("sidebar").classList.remove("open"); $("scrim").classList.remove("open"); render(); return; }

  if (t.closest("#modeBtn")) { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches; r.dataset.theme = dark ? "light" : "dark"; return; }
  if (t.closest("#scrim") || t.closest("#closeMenu")) { $("sidebar").classList.remove("open"); $("scrim").classList.remove("open"); return; }
  const cb = t.closest("[data-chat]"); if (cb) { chatAbierto = cb.dataset.chat; chats.find((x) => x.id === chatAbierto).unread = 0; abierto = null; render(); return; }
  const q = t.closest("[data-q]"); if (q) { const c = chats.find((x) => x.id === chatAbierto); const d = c.dealId && deals.find((x) => x.id === c.dealId); enviar({ pago: PAGO(d ? d.anticipo : 75), recibido: "Recibido, gracias 🙏 Ya quedó apartado tu encargo", listo: "¡Tu encargo ya está listo! Te espero en Dolores Hidalgo 124 😊" }[q.dataset.q]); return; }
  if (t.closest("[data-crear]")) { toast("Aquí se anotaría su encargo"); return; }
  const ch = t.closest(".chip[data-f]"); if (ch) { filtro = ch.dataset.f; render(); return; }
